name: slink
description: slink — parent & teacher mobile app
publish_to: 'none'
version: 1.0.4+7

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.7

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP client
  dio: ^5.6.0

  # Auth — Firebase Phone OTP
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  firebase_messaging: ^15.1.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # PDF viewer
  flutter_pdfview: ^1.3.2

  # Camera capture (homework photos)
  image_picker: ^1.1.2

  # PDF file selection (report card upload)
  file_picker: ^8.1.2

  # Payments
  razorpay_flutter: ^1.3.7

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  freezed_annotation: ^2.4.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

# App icons — regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/icons/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#123E3B"
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png
  min_sdk_android: 21

# Launch screen — regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FBF3EA"
  image: assets/icons/splash_logo.png
  android_12:
    color: "#FBF3EA"
    image: assets/icons/splash_logo.png
